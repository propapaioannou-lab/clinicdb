# Development setup (laptop). Production overrides live in compose.prod.yaml (added at deployment).
name: clinicdb

services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    # Only reachable from this computer, never from the network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development only: catches every email the app sends. Nothing leaves the laptop.
  # Read them at http://localhost:8025
  mail:
    image: docker.io/axllent/mailpit:v1.29
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    volumes:
      - .:/app:z
      - /app/node_modules
      - next-cache:/app/.next
      # Patients' documents (never inside the project folder).
      - documents:/data/documents
    ports:
      - "127.0.0.1:3000:3000"

  # Nightly encrypted backups into ./backups (see README "Backups").
  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - ./backups:/backups:z
      - ./.env:/config/app.env:ro,z
      - documents:/documents:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  next-cache:
  documents:
